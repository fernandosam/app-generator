changelog:
  exclude:
    labels:
      - ignore-for-release # Ignora PRs com essa label
    authors:
      - dependabot # Ignora atualizações automatizadas de robôs no changelog

  categories:
    - title: "🚀 Novas Funcionalidades (Features)"
      labels:
        - feature
        - enhancement

    - title: "🐛 Correções de Bugs (Fixes)"
      labels:
        - bug

    - title: "🧹 Refatoração e Melhorias"
      labels:
        - refactor

    - title: "🔧 Manutenção Geral (Chore)"
      labels:
        - chore
        - maintenance

    - title: "📝 Documentação e Testes"
      labels:
        - documentation
        - testing
