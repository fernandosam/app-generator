name: One-off particle test formatter
on:
  push:
    branches: [feat/coss-five-particles]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(ui): apply Vite+ formatting for particle tests')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coss-five-particles
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vp fmt src/components/particles/particles.test.ts --write
      - name: Commit updated formatting
        run: |
          git add src/components/particles/particles.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(ui): apply Vite+ formatting for particle tests (#56)"
          git push origin HEAD:feat/coss-five-particles
