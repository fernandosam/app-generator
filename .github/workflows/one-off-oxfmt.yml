# Migração pontual do baseline de formatação (issue #37).
# Remover este workflow assim que a normalização estiver versionada.
name: One-off Oxfmt baseline
on:
  push:
    branches: [refactor/viteplus-unified-check-37-39]
    paths: ['.github/workflows/one-off-oxfmt.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/one-off-oxfmt.yml']
permissions:
  contents: write
concurrency:
  group: one-off-oxfmt-baseline
  cancel-in-progress: false
jobs:
  format:
    if: github.event_name == 'push' || (github.event.pull_request.number == 40 && github.event.pull_request.head.repo.full_name == 'fernandosam/app-generator')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: refactor/viteplus-unified-check-37-39
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply official Oxfmt baseline
        run: npm exec -- vp check --fix
        continue-on-error: true
      - name: Commit baseline without changing other workflows
        run: |
          # Workflow templates/CI remain outside this one-off formatter baseline.
          git restore -- .github/
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style(vite+): establish Oxfmt baseline (#37)'
            git push origin HEAD:refs/heads/refactor/viteplus-unified-check-37-39
          fi
