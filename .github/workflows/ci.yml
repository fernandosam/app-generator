name: CI — código e contratos de telas
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Instalar dependências travadas
        run: npm ci --no-audit --no-fund
      - name: Confirmar toolchain Vite+
        run: npm exec -- vp --version
      - name: Verificações estáticas e testes do avaliador
        run: |
          npm run check:static
          npm run check:harness
          npm run test:unit
      - name: Testes do projeto (Vite+)
        run: npm test
      - name: Build (gera routeTree do TanStack Start)
        run: npm run build
      - name: TypeScript
        run: npm run typecheck
