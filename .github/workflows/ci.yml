name: CI — código e contratos de telas
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Instalar dependências travadas
        run: npm ci --no-audit --no-fund
      - name: Validar contratos e segurança do harness
        run: |
          npm run check:static
          npm run check:harness
      - name: Testes Node e contratos da toolchain
        run: npm run test:unit
      - name: Gerar rotas e verificar Vite+ (build, formatação, lint, tipos)
        run: npm run check
      - name: Testes Vite+
        run: npm test
