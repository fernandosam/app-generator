name: IA — gerar tela (manual, PR)
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Descreva a tela, tarefa, conteúdo e público'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: generator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar configuração da IA
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo 'Configure o secret OPENAI_API_KEY para habilitar geração assistida.' >&2
            exit 1
          fi
      - name: Preparar ambiente e agente
        run: |
          npm install --no-audit --no-fund
          npm run ui:install
          npm install --global @openai/codex
          npx playwright install --with-deps chromium
      - name: Gerar tela com escopo limitado ao workspace
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GENERATION_PROMPT: ${{ inputs.prompt }}
        run: npm run screen:generate -- "$GENERATION_PROMPT"
      - name: Validar resultado gerado
        run: |
          npm run check:static
          npm run test:unit
          npm test
          npm run build
          npm run typecheck
          npm run layout:audit
      - name: Publicar logs e imagens para inspeção
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-screen-evidence-${{ github.run_id }}
          path: |
            artifacts/
            test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Abrir PR sem publicar diretamente na main
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ai/generated-screen-${{ github.run_id }}
          delete-branch: true
          commit-message: 'feat(ui): gerar tela a partir de intenção'
          title: 'feat(ui): nova tela gerada por IA'
          body: |
            Geração iniciada manualmente. Avaliação mecânica realizada no workflow.
            Consulte o artifact da execução para capturas de tela e relatórios.
            Revisão visual por IA e testes de produto não estão implícitos na nota.
          add-paths: |
            src/
            docs/
            tests/
            scripts/
            package.json
            components.json
