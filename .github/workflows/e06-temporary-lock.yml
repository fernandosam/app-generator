name: E06 — bootstrap temporário do lockfile
on:
  push:
    branches:
      - feat/e06-agent-first-0.3.0
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar lockfile a partir das dependências declaradas
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validar instalação reproduzível
        run: npm ci --no-audit --no-fund
      - name: Publicar lockfile na branch da E06 (sem alterações na main)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock E06 dependencies for reproducible installs"
            git push origin HEAD:refs/heads/feat/e06-agent-first-0.3.0
          fi
