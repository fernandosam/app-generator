name: Migração Vite+ — regeneração única do lockfile
on:
  push:
    branches: [refactor/viteplus-exclusive-29-31]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: viteplus-lock-refresh
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Resolver dependências e regenerar lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Registrar lockfile somente se alterado
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m "chore(toolchain): regenerate npm lockfile for Vite+ (#29)"
            git push
          fi
      - name: Verificar instalação travada
        run: npm ci --no-audit --no-fund
      - name: Testar toolchain e build
        run: |
          npm run test:unit
          npm test
          npm run build
          npm run typecheck
